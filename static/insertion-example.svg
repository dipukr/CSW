    <rect x="450" y="36" width="72" height="46" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#ex-s)"/>
    <text x="486" y="66" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1E293B">4</text>
