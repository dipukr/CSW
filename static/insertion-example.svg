<svg width="640" height="222" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" role="img" aria-label="Example of Insertion Sort in ascending order: in the array 7, 3, 8, 2, 6, 4, 5 the first element, 7, forms the sorted portion; each next element is inserted in its correct place, giving 2, 3, 4, 5, 6, 7, 8">
