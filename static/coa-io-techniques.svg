<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Three techniques for reading a block of data. (a) Programmed I/O: issue a read command, read the I/O module's status repeatedly until it is ready, read a word, write it to memory, and repeat until done. (b) Interrupt-driven I/O: issue a read command, do something else, and on the interrupt read the status, read the word, write it to memory, and repeat. (c) DMA: issue a read-block command to the DMA module, do something else, and on the interrupt read the DMA module's status, then go on to the next instruction">
