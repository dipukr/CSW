<svg width="780" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-label="Typical PCI Express configuration: two cores and memory attach to the root complex. The root complex links to a PCIe endpoint, a PCIe-to-PCI bridge, and a switch; the switch fans out to further PCIe endpoints and a legacy endpoint">
