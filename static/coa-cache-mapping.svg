    <text x="479.0" y="150" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Tag</text>
    <text x="479.0" y="183" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">22 bits</text>
    <path d="M708 125 H747 A3 3 0 0 1 750 128 V162 A3 3 0 0 1 747 165 H708 A0 0 0 0 1 708 165 V125 A0 0 0 0 1 708 125 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="729.0" y="150" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Word</text>
    <text x="729.0" y="183" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">2 bits</text>
    <text x="20" y="238" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">2-way set associative</text>
    <text x="20" y="257" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B">fixed set; 2 tags compared</text>
    <path d="M253 220 H438 A0 0 0 0 1 438 220 V260 A0 0 0 0 1 438 260 H253 A3 3 0 0 1 250 257 V223 A3 3 0 0 1 253 220 Z" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
