    <text x="333.5" y="88" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">8 bits</text>
    <path d="M417 30 H709 A0 0 0 0 1 709 30 V70 A0 0 0 0 1 709 70 H417 A0 0 0 0 1 417 70 V30 A0 0 0 0 1 417 30 Z" fill="#E7F6F4" stroke="#5EBFB5" stroke-width="1.2"/>
    <text x="563.0" y="55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Line</text>
    <text x="563.0" y="88" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">14 bits</text>
    <path d="M709 30 H747 A3 3 0 0 1 750 33 V67 A3 3 0 0 1 747 70 H709 A0 0 0 0 1 709 70 V30 A0 0 0 0 1 709 30 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="729.5" y="55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Word</text>
    <text x="729.5" y="88" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">2 bits</text>
    <text x="20" y="143" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Fully associative</text>
    <text x="20" y="162" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B">any line; all tags compared</text>
