    <text x="344.0" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">9 bits</text>
    <path d="M438 220 H709 A0 0 0 0 1 709 220 V260 A0 0 0 0 1 709 260 H438 A0 0 0 0 1 438 260 V220 A0 0 0 0 1 438 220 Z" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="573.5" y="245" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Set</text>
    <text x="573.5" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">13 bits</text>
    <path d="M709 220 H747 A3 3 0 0 1 750 223 V257 A3 3 0 0 1 747 260 H709 A0 0 0 0 1 709 260 V220 A0 0 0 0 1 709 220 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="729.5" y="245" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Word</text>
    <text x="729.5" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">2 bits</text>
    <text x="500.0" y="318" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748B">24-bit address · 4-byte blocks · 16K cache lines</text>
</svg>
