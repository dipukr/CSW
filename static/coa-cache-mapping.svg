<svg width="780" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-label="How a 24-bit main-memory address is split by each cache mapping function (4-byte blocks, 16K-line cache). Direct mapping: 8-bit tag, 14-bit line, 2-bit word. Fully associative: 22-bit tag, 2-bit word. Two-way set associative: 9-bit tag, 13-bit set, 2-bit word">
    <defs><marker id="cm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="cm-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="cm-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <text x="20" y="48" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Direct mapped</text>
    <text x="20" y="67" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B">one fixed line per block</text>
    <path d="M253 30 H417 A0 0 0 0 1 417 30 V70 A0 0 0 0 1 417 70 H253 A3 3 0 0 1 250 67 V33 A3 3 0 0 1 253 30 Z" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
