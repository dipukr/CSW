    <rect x="8" y="8" width="704" height="326" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="360" y="32" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#555555">Linux Operating System</text>
    <rect x="25" y="50" width="180" height="126" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="115" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Process 1001</text>
    <text x="115" y="92" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#555555">API Gateway JVM</text>
