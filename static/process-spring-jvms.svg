<svg width="720" height="342" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 342" role="img" aria-label="Three Spring Boot JVM processes on one Linux system, an API gateway (1001), an order service (1002) and a payment service (1003), each with threads scheduled by the Linux CPU scheduler; the gateway calls the order service and the order service calls the payment service over HTTP/TCP">
