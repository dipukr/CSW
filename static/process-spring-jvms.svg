    <path d="M205 113 H268" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#sj-a)"/>
    <text x="237" y="105" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#555555">HTTP/TCP</text>
    <rect x="270" y="50" width="180" height="126" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="360" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Process 1002</text>
    <text x="360" y="92" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#555555">Order Service JVM</text>
