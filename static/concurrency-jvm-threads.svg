    <text x="30" y="36" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#222222">Java Process / JVM</text>
    <rect x="50" y="60" width="180" height="56" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="140" y="85" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Thread 1</text>
