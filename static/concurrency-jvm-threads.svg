    <rect x="270" y="60" width="180" height="56" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="360" y="85" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Thread 2</text>
    <text x="360" y="101" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555">own stack</text>
    <path d="M360 116 V176" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#jt-a)"/>
    <rect x="490" y="60" width="180" height="56" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="580" y="85" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Thread 3</text>
    <text x="580" y="101" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555">own stack</text>
    <path d="M580 116 V176" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#jt-a)"/>
    <rect x="50" y="178" width="620" height="70" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="360" y="210" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Shared Heap Memory</text>
    <text x="360" y="226" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555">objects · shared state · references</text>
