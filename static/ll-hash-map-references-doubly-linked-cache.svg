<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 205" width="700" height="205" role="img" aria-label="Hash map references doubly linked cache entries. Hash lookup and list rewiring work together. A plain linked list alone would require linear key lookup."><defs><marker id="lru" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#555555"/></marker></defs><rect x="20" y="22" width="660" height="45" rx="3" fill="#EDEDED" stroke="#222222"/><text fill="#222222" font-size="12" font-weight="600" x="350" y="49" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">HashMap&lt;Key, Node&gt; : A → node A · B → node B · C → node C</text><g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#lru)"><path d="M145 67V110"/><path d="M350 67V110"/><path d="M555 67V110"/><path d="M205 127H287"/><path d="M287 145H205"/><path d="M412 127H492"/><path d="M492 145H412"/></g><rect fill="#EDEDED" x="85" y="113" width="120" height="46" rx="3" stroke="#222222"/><text fill="#222222" font-size="20" font-weight="600" x="145" y="141" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">A</text><rect fill="#EDEDED" x="290" y="113" width="120" height="46" rx="3" stroke="#222222"/><text fill="#222222" font-size="20" font-weight="600" x="350" y="141" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">B</text><rect fill="#EDEDED" x="495" y="113" width="120" height="46" rx="3" stroke="#222222"/><text fill="#222222" font-size="20" font-weight="600" x="555" y="141" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">C</text><text fill="#222222" font-size="12" font-weight="600" x="145" y="188" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Most recent</text><text fill="#222222" font-size="12" font-weight="600" x="555" y="188" text-anchor="middle" f