<svg width="720" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-label="Task A is preempted or blocks; the kernel scheduler preserves its context, updates its state, selects Task B, switches address space if needed, restores B and resumes it">
    <defs><marker id="cs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs>
    <rect x="35" y="16" width="170" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="120" y="42.55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Task A</text>
    <rect x="275" y="16" width="170" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="360" y="42.55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Kernel Scheduler</text>
    <rect x="515" y="16" width="170" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="600" y="42.55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Task B</text>
    <path d="M120 60 V442" fill="none" stroke="#AAAAAA" stroke-width="1.2" stroke-dasharray="5 4"/>
    <path d="M360 60 V442" fill="none" stroke="#AAAAAA" stroke-width="1.2" stroke-dasharray="5 4"/>
    <path d="M600 60 V442" fill="none" stroke="#AAAAAA" stroke-width="1.2" stroke-dasharray="5 4"/>
    <path d="M120 92 H357" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cs-a)"/>
    <text x="240" y="85" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">Timer preemption or blocking event</text>
    <path d="M360 130 H404 V150 H363" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cs-a)"/>
    <rect x="408" y="131" width="200" height="18" fill="#FFFFFF"/>
    <text x="412" y="144" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">Preserve A&#8217;s execution context</text>
    <path d="M360 176 H404 V196 H363" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cs-a)"/>
    <rect x="408" y="177" width="110.4" height="18" fill="#FFFFFF"/>
    <text x="412" y="190" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">Update A&#8217;s state</text>
    <path d="M360 222 H404 V242 H363" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cs-a)"/>
    <rect x="408" y="223" width="148.8" height="18" fill="#FFFFFF"/>
    <text x="412" y="236" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">Select runnable Task B</text>
    <path d="M360 268 H404 V288 H363" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cs-a)"/>
    <rect x="408" y="269" width="251.2" height="18" fill="#FFFFFF"/>
    <text x="412" y="282" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">Switch address-space context if needed</text>
    <path d="M360 314 H404 V334 H363" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cs-a)"/>
    <rect x="408" y="315" width="129.6" height="18" fill="#FFFFFF"/>
    <text x="412" y="328" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">Restore B&#8217;s context</text>
    <path d="M360 360 H597" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cs-a)"/>
    <text x="480" y="353" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">Resume Task B</text>
    <path d="M600 398 H556 V418 H597" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cs-a)"/>
    <rect x="416" y="399" width="136" height="18" fill="#FFFFFF"/>
    <text x="548" y="412" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">Execute instructions</text>
</svg>
