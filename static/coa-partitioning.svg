<svg width="800" height="370" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-label="Memory partitioning of a 64-MB memory. (a) Fixed partitioning with equal 8-MB partitions. (b) Fixed partitioning with unequal partitions of 2, 4, 6, 8, 8, 12 and 16 MB. (c) Dynamic partitioning over time: processes of 20, 14 and 18 MB are loaded; process 2 is swapped out and process 4 (8 MB) takes part of its space, leaving small holes that cause external fragmentation">
