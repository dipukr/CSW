<svg width="780" height="440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-label="Simple interrupt processing. Hardware: a device controller issues an interrupt; the processor finishes the current instruction, signals acknowledgment, pushes the PSW and PC onto the control stack, and loads a new PC based on the interrupt. Software: save the rest of the process state, process the interrupt, restore the process state, and restore the old PSW and PC">
    <defs><marker id="ip-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="ip-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="ip-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <text x="195" y="22" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Hardware</text>
    <text x="585" y="22" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Software</text>
    <rect x="50" y="40" width="290" height="52" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#ip-s)"/>
    <text x="195.0" y="62.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Device controller or other hardware</text>
    <text x="195.0" y="77.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">issues an interrupt</text>
    <rect x="50" y="118" width="290" height="52" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#ip-s)"/>
    <text x="195.0" y="140.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Processor finishes execution</text>
    <text x="195.0" y="155.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">of current instruction</text>
    <path d="M195 92 V114" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ip-a)"/>
    <rect x="50" y="196" width="290" height="52" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#ip-s)"/>
    <text x="195.0" y="218.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Processor signals</text>
    <text x="195.0" y="233.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">acknowledgment of interrupt</text>
    <path d="M195 170 V192" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ip-a)"/>
    <rect x="50" y="274" width="290" height="52" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#ip-s)"/>
    <text x="195.0" y="296.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Processor pushes PSW and PC</text>
    <text x="195.0" y="311.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">onto control stack</text>
    <path d="M195 248 V270" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ip-a)"/>
    <rect x="50" y="352" width="290" height="52" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#ip-s)"/>
    <text x="195.0" y="374.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Processor loads new PC value</text>
    <text x="195.0" y="389.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">based on interrupt</text>
    <path d="M195 326 V348" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ip-a)"/>
    <rect x="440" y="40" width="290" height="52" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#ip-s)"/>
    <text x="585.0" y="62.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Save remainder of</text>
    <text x="585.0" y="77.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">process state information</text>
    <rect x="440" y="118" width="290" height="52" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#ip-s)"/>
    <text x="585.0" y="148.2" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Process interrupt</text>
    <path d="M585 92 V114" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ip-a)"/>
    <rect x="440" y="196" width="290" height="52" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#ip-s)"/>
    <text x="585.0" y="218.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Restore process</text>
    <text x="585.0" y="233.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">state information</text>
    <path d="M585 170 V192" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ip-a)"/>
    <rect x="440" y="274" width="290" height="52" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#ip-s)"/>
    <text x="585.0" y="304.2" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Restore old PSW and PC</text>
    <path d="M585 248 V270" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ip-a)"/>
    <path d="M340 378 H390 V66 H436" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ip-a)"/>
</svg>
