    <text x="505.0" y="169.6" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Cache</text>
    <path d="M375 165 H426" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#lpc-a)"/>
    <rect x="635" y="140" width="150" height="50" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#lpc-s)"/>
    <text x="710.0" y="169.6" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Main memory</text>
    <path d="M580 165 H631" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#lpc-a)"/>
    <text x="197" y="157" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">logical</text>
    <text x="402" y="157" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">physical</text>
    <text x="607" y="157" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">physical</text>
</svg>
