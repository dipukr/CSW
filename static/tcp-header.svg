<svg width="720" height="306" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" role="img" aria-label="TCP header, 32 bits per row: source port and destination port; sequence number; acknowledgment number; data offset, reserved, flags and window; checksum and urgent pointer; options and padding (0 to 40 bytes); then the data payload. Header: 20 to 60 bytes total.">
    <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" fill="#222222">
        <text x="40" y="20" font-size="11" fill="#555555">0</text>
        <text x="200" y="20" font-size="11" fill="#555555" text-anchor="middle">8</text>
        <text x="360" y="20" font-size="11" fill="#555555" text-anchor="middle">16</text>
        <text x="520" y="20" font-size="11" fill="#555555" text-anchor="middle">24</text>
        <text x="680" y="20" font-size="11" fill="#555555" text-anchor="end">31</text>
        <g fill="#FFFFFF" stroke="#222222" stroke-width="1.2">
            <rect x="40" y="28" width="320" height="34"/><rect x="360" y="28" width="320" height="34"/>
            <rect x="40" y="62" width="640" height="34"/>
            <rect x="40" y="96" width="640" height="34"/>
            <rect x="40" y="130" width="80" height="34"/><rect x="120" y="130" width="80" height="34"/><rect x="200" y="130" width="160" height="34"/><rect x="360" y="130" width="320" height="34"/>
            <rect x="40" y="164" width="320" height="34"/><rect x="360" y="164" width="320" height="34"/>
            <rect x="40" y="198" width="640" height="32" stroke-dasharray="5 3"/>
        </g>
        <rect x="40" y="240" width="640" height="32" fill="#F3F4F6" stroke="#222222" stroke-width="1.2" stroke-dasharray="5 3"/>
        <g font-size="13" text-anchor="middle">
            <text x="200" y="49.5">Source Port (16)</text><text x="520" y="49.5">Destination Port (16)</text>
            <text x="360" y="83.5">Sequence Number (32)</text>
            <text x="360" y="117.5">Acknowledgment Number (32)</text>
            <text x="80" y="151" font-size="11">Offset (4)</text><text x="160" y="151" font-size="11">Rsvd (4)</text><text x="280" y="151.5">Flags (8)</text><text x="520" y="151.5">Window (16)</text>
            <text x="200" y="185.5">Checksum (16)</text><text x="520" y="185.5">Urgent Pointer (16)</text>
            <text x="360" y="218.5">Options + Padding (0–40 bytes)</text>
            <text x="360" y="260.5">Data / Payload (variable length)</text>
        </g>
        <text x="40" y="294" font-size="12" fill="#555555">Header: 20–60 bytes total</text>
    </g>
</svg>
