    <path d="M220 178 H326" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mpc-a)"/>
    <path d="M530 344 H620 V103 H534" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mpc-a)"/>
    <text x="628" y="230" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">next-address</text>
    <text x="628" y="246" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">control</text>
    <path d="M530 406 H700" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mpc-a)"/>
    <text x="708" y="410" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">control signals within CPU</text>
    <path d="M530 424 H700" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mpc-a)"/>
    <text x="708" y="440" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">control signals to system bus</text>
</svg>
