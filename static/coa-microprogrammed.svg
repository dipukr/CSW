<svg width="900" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Microprogrammed control unit: the instruction register and flags feed sequencing logic, which, with the clock, loads the control address register. That address reads a microinstruction from control memory into the control buffer register. A decoder turns its control bits into control signals within the CPU and to the system bus, and its next-address information returns to the sequencing logic">
    <defs><marker id="mpc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="mpc-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="mpc-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <rect x="330" y="10" width="200" height="36" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#mpc-s)"/>
    <text x="430.0" y="32.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Instruction register</text>
    <rect x="330" y="80" width="200" height="46" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#mpc-s)"/>
    <text x="430.0" y="107.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Sequencing logic</text>
    <rect x="330" y="160" width="200" height="40" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#mpc-s)"/>
    <text x="430.0" y="184.4" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1E293B">Control address register</text>
    <rect x="330" y="230" width="200" height="64" rx="3" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2" filter="url(#mpc-s)"/>
    <text x="430.0" y="258.6" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Control memory</text>
    <text x="430.0" y="274.6" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">(microprogram)</text>
    <rect x="330" y="324" width="200" height="40" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#mpc-s)"/>
    <text x="430.0" y="348.4" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1E293B">Control buffer register</text>
    <rect x="330" y="394" width="200" height="40" rx="3" fill="#E7F6F4" stroke="#5EBFB5" stroke-width="1.2" filter="url(#mpc-s)"/>
    <text x="430.0" y="418.6" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Decoder</text>
    <path d="M430 46 V76" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mpc-a)"/>
    <path d="M430 126 V156" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mpc-a)"/>
    <path d="M430 200 V226" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mpc-a)"/>
    <path d="M430 294 V320" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mpc-a)"/>
    <path d="M430 364 V390" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mpc-a)"/>
    <rect x="90" y="85" width="130" height="36" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#mpc-s)"/>
    <text x="155.0" y="107.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">Flags</text>
    <path d="M220 103 H326" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mpc-a)"/>
    <rect x="90" y="160" width="130" height="36" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#mpc-s)"/>
