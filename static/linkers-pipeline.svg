<svg width="760" height="262" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" role="img" aria-label="Build pipeline: main.c is translated by the compiler into main.s, the assembler turns it into the object file main.o; the linker combines main.o with util.o and the archive libc.a into the executable prog; the loader maps prog into a process with text, data, heap and stack">
    <defs><marker id="lp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs>
    <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" fill="#222222">
        <!-- row 1: compile and assemble -->
        <g stroke="#222222" stroke-width="1.2">
            <rect x="20" y="30" width="90" height="44" rx="3" fill="#FFFFFF"/>
            <rect x="140" y="30" width="110" height="44" rx="10" fill="#F1F5F9"/>
            <rect x="280" y="30" width="90" height="44" rx="3" fill="#FFFFFF"/>
            <rect x="400" y="30" width="110" height="44" rx="10" fill="#F1F5F9"/>
            <rect x="540" y="30" width="90" height="44" rx="3" fill="#FFFFFF"/>
        </g>
        <g font-size="13" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">
            <text x="65" y="57">main.c</text>
            <text x="325" y="57">main.s</text>
            <text x="585" y="57">main.o</text>
        </g>
        <g font-size="14" font-weight="600" text-anchor="middle">
            <text x="195" y="57">Compiler</text>
            <text x="455" y="57">Assembler</text>
        </g>
        <g font-size="11" text-anchor="middle" fill="#666666">
            <text x="65" y="92">source</text>
            <text x="325" y="92">assembly</text>
            <text x="578" y="92" text-anchor="end">object file</text>
        </g>

        <!-- row 2: link and load -->
        <g stroke="#222222" stroke-width="1.2">
            <rect x="520" y="150" width="120" height="44" rx="10" fill="#F1F5F9"/>
            <rect x="660" y="118" width="80" height="36" rx="3" fill="#FFFFFF"/>
            <rect x="660" y="190" width="80" height="36" rx="3" fill="#FFFFFF"/>
            <rect x="380" y="150" width="90" height="44" rx="3" fill="#FFFFFF"/>
            <rect x="240" y="150" width="110" height="44" rx="10" fill="#F1F5F9"/>
            <rect x="20" y="118" width="190" height="124" rx="3" fill="#FFFFFF"/>
        </g>
        <g font-size="14" font-weight="600" text-anchor="middle">
            <text x="580" y="177">Linker</text>
            <text x="295" y="177">Loader</text>
            <text x="115" y="138">Process</text>
        </g>
        <g font-size="13" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">
            <text x="700" y="141">util.o</text>
            <text x="700" y="213">libc.a</text>
            <text x="425" y="177">prog</text>
        </g>
        <text x="425" y="212" font-size="11" text-anchor="middle" fill="#666666">executable</text>
        <text x="700" y="243" font-size="11" text-anchor="middle" fill="#666666">static library</text>

        <!-- process image -->
        <g stroke="#94A3B8" stroke-width="1" fill="#F8FAFC">
            <rect x="35" y="148" width="160" height="20" rx="2"/>
            <rect x="35" y="170" width="160" height="20" rx="2"/>
            <rect x="35" y="192" width="160" height="20" rx="2"/>
            <rect x="35" y="214" width="160" height="20" rx="2"/>
        </g>
        <g font-size="12" text-anchor="middle" fill="#444444">
            <text x="115" y="162">text (code)</text>
            <text x="115" y="184">data + bss</text>
            <text x="115" y="206">heap</text>
            <text x="115" y="228">stack</text>
        </g>

        <!-- arrows -->
        <g fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#lp-a)">
            <path d="M110 52 H138"/>
            <path d="M250 52 H278"/>
            <path d="M370 52 H398"/>
            <path d="M510 52 H538"/>
            <path d="M585 74 V148"/>
            <path d="M660 136 L642 162"/>
            <path d="M660 208 L642 184"/>
            <path d="M520 172 H472"/>
            <path d="M380 172 H352"/>
            <path d="M240 172 H212"/>
        </g>

        <!-- legend -->
        <rect x="652" y="32" width="16" height="12" rx="4" fill="#F1F5F9" stroke="#222222" stroke-width="1"/>
        <text x="674" y="42" font-size="11" fill="#666666">tool</text>
        <rect x="652" y="54" width="16" height="12" rx="1" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
        <text x="674" y="64" font-size="11" fill="#666666">file</text>
    </g>
</svg>
