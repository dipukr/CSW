<svg width="720" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Decision guide: if the relationship is not a genuine IS-A with valid substitutability, prefer composition; if it is, inheritance is an option after checking the subtype contract">
    <defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker><marker id="dg-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9A9A9A"/></marker></defs>
    <rect x="250" y="14" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="360" y="37" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Need code reuse or</text>
    <text x="360" y="53" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">shared behavior?</text>
    <path d="M360 66 V96" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#dg-a)"/>
    <path d="M360 98 L470 148 L360 198 L250 148 Z" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="360" y="145" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Genuine IS-A?</text>
    <text x="360" y="161" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">Valid substitutability?</text>
    <path d="M250 148 H140 V228" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#dg-a)"/>
    <text x="196" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#555555" font-style="italic">No</text>
    <path d="M470 148 H580 V228" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#dg-a)"/>
    <text x="524" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#555555" font-style="italic">Yes</text>
    <rect x="40" y="230" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="140" y="255" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Prefer composition</text>
    <text x="140" y="271" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">Collaborate via interfaces</text>
    <rect x="480" y="230" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="580" y="255" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Inheritance is an option</text>
    <text x="580" y="271" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#555555">Check the subtype contract</text>
</svg>
