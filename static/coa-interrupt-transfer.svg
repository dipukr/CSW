<svg width="640" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Transfer of control via interrupts: the user program runs instructions 1 to i; an interrupt occurs after instruction i, control passes to the interrupt handler, which runs to completion, and the user program resumes at instruction i + 1">
