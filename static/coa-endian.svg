<svg width="720" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Byte ordering of the 32-bit value 12345678 hex stored at address 184. Big-endian puts the most significant byte 12 at address 184, then 34, 56, 78. Little-endian puts the least significant byte 78 at address 184, then 56, 34, 12">
