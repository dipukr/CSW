<svg width="900" height="170" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" role="img" aria-label="x86 address translation: a logical address (segment selector and offset) is turned by the segmentation unit, using segment descriptors, into a linear address; the paging unit then translates the linear address through the page directory and page tables into a physical address in main memory">
    <defs><marker id="x86t-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="x86t-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="x86t-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <rect x="20" y="50" width="150" height="64" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#x86t-s)"/>
    <text x="95.0" y="78.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Logical address</text>
    <text x="95.0" y="93.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">(selector : offset)</text>
    <rect x="198" y="50" width="150" height="64" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#x86t-s)"/>
    <text x="273.0" y="78.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Segmentation unit</text>
    <text x="273.0" y="93.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">(descriptor tables)</text>
    <path d="M170 82 H194" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#x86t-a)"/>
    <rect x="376" y="50" width="150" height="64" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#x86t-s)"/>
    <text x="451.0" y="78.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Linear address</text>
    <text x="451.0" y="93.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">(dir | table | offset)</text>
    <path d="M348 82 H372" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#x86t-a)"/>
    <rect x="554" y="50" width="150" height="64" rx="3" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2" filter="url(#x86t-s)"/>
    <text x="629.0" y="78.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Paging unit</text>
    <text x="629.0" y="93.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">(page directory, page table)</text>
    <path d="M526 82 H550" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#x86t-a)"/>
    <rect x="732" y="50" width="150" height="64" rx="3" fill="#E7F6F4" stroke="#5EBFB5" stroke-width="1.2" filter="url(#x86t-s)"/>
    <text x="807.0" y="78.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">Physical</text>
    <text x="807.0" y="93.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">address</text>
    <path d="M704 82 H728" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#x86t-a)"/>
    <text x="450" y="150" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">paging can be disabled, in which case the linear address is the physical address</text>
</svg>
