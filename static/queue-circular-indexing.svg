        <text x="360" y="116" font-size="12" text-anchor="middle" fill="#6B7280">[2]</text>
        <text x="360" y="144" font-size="22" text-anchor="middle" font-weight="600">2</text>
        <rect x="426" y="96" width="100" height="64" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="476" y="116" font-size="12" text-anchor="middle" fill="#6B7280">[3]</text>
        <text x="476" y="144" font-size="22" text-anchor="middle" font-weight="600">3</text>
        <rect x="542" y="96" width="100" height="64" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="592" y="116" font-size="12" text-anchor="middle" fill="#6B7280">[4]</text>
        <text x="592" y="144" font-size="22" text-anchor="middle" font-weight="600">4</text>
        <path d="M128 90 Q186 54 244 90" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#qc-a)"/>
        <text x="186" y="66" font-size="12" text-anchor="middle" fill="#6B7280">+1</text>
        <path d="M244 90 Q302 54 360 90" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#qc-a)"/>
        <text x="302" y="66" font-size="12" text-anchor="middle" fill="#6B7280">+1</text>
        <path d="M360 90 Q418 54 476 90" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#qc-a)"/>
        <text x="418" y="66" font-size="12" text-anchor="middle" fill="#6B7280">+1</text>
        <path d="M476 90 Q534 54 592 90" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#qc-a)"/>
        <text x="534" y="66" font-size="12" text-anchor="middle" fill="#6B7280">+1</text>
        <path d="M592 166 V200 Q592 218 574 218 H146 Q128 218 128 200 V166" fill="none" stroke="#555555" stroke-width="2.2" marker-end="url(#qc-a)"/>
        <text x="360" y="210" font-size="13" text-anchor="middle" font-weight="600">Wrap around: index 4 → index 0</text>
        <rect x="190" y="236" width="340" height="34" rx="3" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.2"/>
        <text x="360" y="258" font-size="14" text-anchor="middle">Next index = (current index + 1) % 5</text>
