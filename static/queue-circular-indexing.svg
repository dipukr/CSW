    <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" fill="#222222">
        <rect x="78" y="96" width="100" height="64" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="128" y="116" font-size="12" text-anchor="middle" fill="#6B7280">[0]</text>
        <text x="128" y="144" font-size="22" text-anchor="middle" font-weight="600">0</text>
        <rect x="194" y="96" width="100" height="64" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="244" y="116" font-size="12" text-anchor="middle" fill="#6B7280">[1]</text>
        <text x="244" y="144" font-size="22" text-anchor="middle" font-weight="600">1</text>
