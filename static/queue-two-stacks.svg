<svg width="720" height="290" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="Two-stack queue: inStack holds 10, 20, 30 with 30 on top; transferring pops each element and pushes it onto outStack, reversing the order so 10 becomes the top">
    <defs><marker id="qs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs>
    <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" fill="#222222">
        <text x="190" y="36" font-size="15" text-anchor="middle" font-weight="600">inStack</text>
        <path d="M110 64 V232 H270 V64" fill="none" stroke="#222222" stroke-width="2"/>
        <rect x="125" y="72" width="130" height="44" rx="3" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
        <text x="190" y="101" font-size="18" text-anchor="middle" font-weight="600">30</text>
        <rect x="125" y="124" width="130" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="190" y="153" font-size="18" text-anchor="middle" font-weight="600">20</text>
        <rect x="125" y="176" width="130" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="190" y="205" font-size="18" text-anchor="middle" font-weight="600">10</text>
        <text x="190" y="260" font-size="13" text-anchor="middle" fill="#6B7280">30 is on top</text>
        <text x="560" y="36" font-size="15" text-anchor="middle" font-weight="600">outStack</text>
        <path d="M480 64 V232 H640 V64" fill="none" stroke="#222222" stroke-width="2"/>
        <rect x="495" y="72" width="130" height="44" rx="3" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
        <text x="560" y="101" font-size="18" text-anchor="middle" font-weight="600">10</text>
        <rect x="495" y="124" width="130" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="560" y="153" font-size="18" text-anchor="middle" font-weight="600">20</text>
        <rect x="495" y="176" width="130" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="560" y="205" font-size="18" text-anchor="middle" font-weight="600">30</text>
        <text x="560" y="260" font-size="13" text-anchor="middle" fill="#6B7280">10 becomes top</text>
        <path d="M290 120 Q375 60 460 120" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#qs-a)"/>
        <text x="375" y="74" font-size="13" text-anchor="middle" font-weight="600">Transfer</text>
        <text x="375" y="150" font-size="12" text-anchor="middle" fill="#6B7280">pop each element,</text>
        <text x="375" y="166" font-size="12" text-anchor="middle" fill="#6B7280">push onto outStack</text>
    </g>
</svg>
