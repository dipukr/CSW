    <text x="278" y="232" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B">Array of</text>
    <text x="278" y="256" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B">Linked Lists</text>
