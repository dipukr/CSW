<svg width="800" height="516" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 516" role="img" aria-label="Hash table as an array of linked lists: a vertical array of 6 buckets, each pointing to a linked list (chain) of key: value entries that ends in null. Bucket 0 chains ant, bat and cat; bucket 1 holds dog; bucket 2 chains eel, fox and gnu, which collided on index 2; bucket 3 chains hen, owl and yak; bucket 4 is empty; bucket 5 chains pig and ram. With 12 entries in 6 buckets the load factor is 2.0, so get and put take O(1 + load factor) on average and O(n) in the worst case. Looking up owl: hash it to bucket 3, skip hen, find owl with value 7. Side panels show the hash step (owl hashes to 1179, and 1179 % 6 = 3) and the three fields of a node: key, value and a next pointer">
