<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 236" font-family="'Segoe UI', Roboto, Arial, sans-serif" fill="#222">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#444"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#444" stroke-width="1.5"/>
    </marker>
  </defs>
  <g fill="#fff" stroke="#222" stroke-width="1.5">
    <rect rx="3" x="20" y="10" width="180" height="50"/>
    <rect rx="3" x="20" y="84" width="180" height="68"/>
    <rect rx="3" x="20" y="176" width="180" height="50"/>
  </g>
  <g stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <path d="M110 60 V81"/>
    <path d="M110 152 V173"/>
  </g>
  <g>
    <text x="110" y="31" text-anchor="middle" font-size="13" font-weight="700">OrderController</text>
    <text x="110" y="49" text-anchor="middle" font-size="12" fill="#555" font-family="Consolas, 'Courier New', monospace">+ createOrder(request)</text>
    <text x="110" y="105" text-anchor="middle" font-size="13" font-weight="700">OrderService</text>
    <text x="110" y="123" text-anchor="middle" font-size="12" fill="#555" font-family="Consolas, 'Courier New', monospace">+ placeOrder(order)</text>
    <text x="110" y="141" text-anchor="middle" font-size="12" fill="#555" font-family="Consolas, 'Courier New', monospace">+ cancelOrder(id)</text>
    <text x="110" y="197" text-anchor="middle" font-size="13" font-weight="700">OrderRepository</text>
    <text x="110" y="215" text-anchor="middle" font-size="12" fill="#555" font-family="Consolas, 'Courier New', monospace">+ save(order)</text>
  </g>
</svg>
