<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 272" font-family="'Segoe UI', Roboto, Arial, sans-serif" fill="#222">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#444"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#444" stroke-width="1.5"/>
    </marker>
  </defs>
  <g fill="#fff" stroke="#222" stroke-width="1.5">
    <rect rx="3" x="20" y="10" width="540" height="52"/>
    <rect rx="3" x="20" y="92" width="540" height="70"/>
    <rect rx="3" x="20" y="192" width="540" height="70"/>
  </g>
  <g stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <path d="M290 62 V89"/>
    <path d="M290 162 V189"/>
  </g>
  <g>
    <text x="290" y="34" text-anchor="middle" font-size="14" font-weight="700">System Design</text>
    <text x="290" y="54" text-anchor="middle" font-size="12" fill="#555">Requirements, architecture, components, interactions and trade-offs</text>
    <text x="290" y="116" text-anchor="middle" font-size="14" font-weight="700">High-Level Design (HLD)</text>
    <text x="290" y="136" text-anchor="middle" font-size="12" fill="#555">The overall architecture of the system</text>
    <text x="290" y="154" text-anchor="middle" font-size="12" fill="#555">Services, databases, API boundaries, message brokers, data flow, deployment topology</text>
    <text x="290" y="216" text-anchor="middle" font-size="14" font-weight="700">Low-Level Design (LLD)</text>
    <text x="290" y="236" text-anchor="middle" font-size="12" fill="#555">The internal design of components</text>
    <text x="290" y="254" text-anchor="middle" font-size="12" fill="#555">Classes, interfaces, design patterns, methods, algorithms, data structures</text>
  </g>
</svg>
