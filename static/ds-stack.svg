<svg width="640" height="270" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-label="Stack: values 10, 20, 30, 40 stacked with 40 on top; push adds a new element on top and pop removes the top element, last in first out">
