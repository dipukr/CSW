    <rect x="240" y="210" width="160" height="40" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="320.0" y="235.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#222222">10</text>
    <rect x="240" y="166" width="160" height="40" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="320.0" y="191.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#222222">20</text>
    <rect x="240" y="122" width="160" height="40" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="320.0" y="147.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#222222">30</text>
    <rect x="240" y="78" width="160" height="40" rx="0" fill="#FFF7ED" stroke="#B45309" stroke-width="1.2"/>
    <text x="320.0" y="103.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#222222">40</text>
    <path d="M236 80 V254 H404 V80" fill="none" stroke="#222222" stroke-width="1.6"/>
    <text x="416" y="104" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#B45309">← top</text>
    <path d="M180 30 C 200 30, 260 40, 280 70" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#st-a)"/>
