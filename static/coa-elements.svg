<svg width="780" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" role="img" aria-label="Fundamental computer elements: (a) a gate takes inputs, computes a Boolean logic function when activated by a control signal, and produces an output; (b) a memory cell stores one binary value, written from its input under a write signal and sensed at its output under a read signal">
    <defs><marker id="el-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="el-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="el-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <text x="205" y="28" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">(a) Gate</text>
    <rect x="120" y="60" width="170" height="60" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#el-s)"/>
    <text x="205.0" y="86.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">Boolean logic</text>
    <text x="205.0" y="102.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">function</text>
    <path d="M40 78 H116" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#el-a)"/>
    <path d="M40 102 H116" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#el-a)"/>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">inputs</text>
    <path d="M290 90 H360" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#el-a)"/>
    <text x="325" y="82" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">output</text>
    <path d="M205 165 V124" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#el-a)"/>
    <text x="205" y="182" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">activate signal</text>
    <text x="575" y="28" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">(b) Memory cell</text>
    <rect x="500" y="60" width="150" height="60" rx="3" fill="#E7F6F4" stroke="#5EBFB5" stroke-width="1.2" filter="url(#el-s)"/>
    <text x="575.0" y="86.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">Binary storage</text>
    <text x="575.0" y="102.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">cell</text>
    <path d="M420 90 H496" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#el-a)"/>
    <text x="458" y="82" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">input</text>
    <path d="M650 90 H730" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#el-a)"/>
    <text x="690" y="82" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">output</text>
    <path d="M545 165 V124" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#el-a)"/>
    <text x="545" y="182" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">read</text>
