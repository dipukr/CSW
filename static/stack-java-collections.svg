oe UI', Arial, sans-serif">LinkedList</text><text x="80" y="195" text-anchor="middle" font-size="11" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Legacy class</text><text x="200" y="195" text-anchor="middle" font-size="11" fill="#222222" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Preferred</text><text x="311" y="195" text-anchor="middle" font-size="11" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Node based</text><text x="180" y="220" text-anchor="middle" font-size="10" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Simplified class and interface relationships</text></svg>
