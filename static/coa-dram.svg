<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Typical 16-megabit DRAM (4M x 4): address pins A0 to A10 carry the row address into the row address buffer and then the column address into the column address buffer. A multiplexer chooses between the row address and the refresh counter; the row decoder selects a row of the 2048 x 2048 x 4 memory array and the column decoder selects the bits, which pass through the data input and output buffers on D1 to D4. Timing and control logic is driven by RAS, CAS, WE and OE">
