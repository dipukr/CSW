    <text x="240.0" y="124.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">Refresh counter</text>
    <rect x="170" y="160" width="140" height="40" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#dram-s)"/>
