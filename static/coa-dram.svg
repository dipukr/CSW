    <rect x="300" y="20" width="240" height="46" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#dram-s)"/>
    <text x="420.0" y="47.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Timing and control</text>
