    <text x="240.0" y="311.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1E293B">buffer</text>
    <rect x="350" y="130" width="60" height="90" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#dram-s)"/>
