<svg width="900" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="x86 instruction format: optional instruction prefixes (0 to 4 bytes), opcode (1 to 3 bytes), optional ModR/M byte, optional SIB byte, displacement (0, 1, 2 or 4 bytes) and immediate (0, 1, 2 or 4 bytes). ModR/M splits into Mod (2 bits), Reg/Opcode (3 bits) and R/M (3 bits); SIB splits into Scale (2), Index (3) and Base (3). The prefixes are instruction prefix, segment override, operand size override and address size override, each 0 or 1 byte">
