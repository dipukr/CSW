<svg width="840" height="235" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 235" role="img" aria-label="Instruction cycle with interrupts: from START the processor fetches the next instruction and executes it. If interrupts are enabled it then checks for an interrupt and runs the interrupt cycle, which loads the handler address into the PC, before fetching again. With interrupts disabled it returns straight to fetch. Execution can end in HALT">
    <defs><marker id="ic-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="ic-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="ic-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <rect x="20" y="80" width="80" height="40" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#ic-s)"/>
    <text x="60.0" y="104.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">START</text>
    <rect x="140" y="70" width="170" height="60" rx="3" fill="#E7F6F4" stroke="#5EBFB5" stroke-width="1.2" filter="url(#ic-s)"/>
    <text x="225.0" y="96.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">Fetch cycle</text>
    <text x="225.0" y="112.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">fetch next instruction</text>
    <rect x="350" y="70" width="170" height="60" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#ic-s)"/>
    <text x="435.0" y="96.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">Execute cycle</text>
    <text x="435.0" y="112.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">execute instruction</text>
    <rect x="620" y="70" width="190" height="60" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#ic-s)"/>
    <text x="715.0" y="96.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">Interrupt cycle</text>
    <text x="715.0" y="112.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1E293B">check and process interrupt</text>
    <rect x="395" y="12" width="80" height="30" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#ic-s)"/>
    <text x="435.0" y="31.2" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B">HALT</text>
    <path d="M100 100 H136" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ic-a)"/>
    <path d="M310 100 H346" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ic-a)"/>
    <path d="M520 100 H616" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ic-a)"/>
    <text x="568" y="82" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">interrupts</text>
    <text x="568" y="94" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">enabled</text>
    <path d="M435 70 V46" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ic-a)"/>
    <path d="M435 130 V170 H250 V134" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ic-a)"/>
    <text x="342" y="163" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">interrupts disabled</text>
    <path d="M715 130 V210 H200 V134" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ic-a)"/>
    <text x="458" y="203" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">handler address loaded into PC</text>
</svg>
