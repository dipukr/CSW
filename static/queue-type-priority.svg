<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" role="img" aria-label="Priority queue: elements H, M and L for high, medium and low priority; the highest priority leaves first">
    <defs><marker id="tp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs>
    <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" fill="#222222">
        <rect x="30" y="26" width="42" height="40" rx="3" fill="#E5E7EB" stroke="#222222" stroke-width="1.2"/>
        <text x="51" y="52" font-size="15" text-anchor="middle" font-weight="600">H</text>
        <rect x="80" y="26" width="42" height="40" rx="3" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
        <text x="101" y="52" font-size="15" text-anchor="middle" font-weight="600">M</text>
        <rect x="130" y="26" width="42" height="40" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="151" y="52" font-size="15" text-anchor="middle" font-weight="600">L</text>
        <text x="30" y="18" font-size="11" text-anchor="start" fill="#6B7280">highest first</text>
        <path d="M30 84 H172" fill="none" stroke="#555555" stroke-width="1.5" marker-start="url(#tp-a)"/>
    </g>
</svg>
