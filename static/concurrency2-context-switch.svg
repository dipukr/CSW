<svg role="img" viewBox="-18.5 -10 620 760" height="760" xmlns="http://www.w3.org/2000/svg" width="620" id="cs" aria-label="Context switch: Thread A executes until preempted or blocked, yields to the OS scheduler, which preserves its execution state and dispatches Thread B; when B yields, the scheduler resumes Thread A from its saved context"><g><rect class="actor actor-bottom" ry="3" rx="3" name="T2" height="65" width="150" stroke="#666" fill="#eaeaea" y="675" x="433"/><text style="text-anchor: middle; font-size: 16px; font-weight: 400;" class="actor" alignment-baseline="central" dominant-baseline="central" y="707.5" x="508"><tspan dy="0" x="508">Thread B</tspan></text></g><g><rect class="actor actor-bottom" ry="3" rx="3" name="OS" height="65" width="150" stroke="#666" fill="#eaeaea" y="675" x="233"/><text style="text-anchor: middle; font-size: 16px; font-weight: 400;" class="actor" alignment-baseline="central" dominant-baseline="central" y="707.5" x="308"><tspan dy="0" x="308">OS Scheduler</tspan></text></g><g><rect class="actor actor-bottom" ry="3" rx="3" name="T1" height="65" width="150" stroke="#666" fill="#eaeaea" y="675" x="0"/><text style="text-anchor: middle; font-size: 16px; font-weight: 400;" class="actor" alignment-baseline="central" dominant-baseline="central" y="707.5" x="75"><tspan dy="0" x="75">Thread A</tspan></text></g><g><line stroke="#999" stroke-width="0.5px" class="200" y2="675" x2="508" y1="5" x1="508" id="actor2"/><g id="root-2"><rect class="actor actor-top" ry="3" rx="3" name="T2" height="65" width="150" stroke="#666" fill="#eaeaea" y="0" x="433"/><text style="text-anchor: middle; font-size: 16px; font-weight: 400;" class="actor" alignment-baseline="central" dominant-baseline="central" y="32.5" x="508"><tspan dy="0" x="508">Thread B</tspan></text></g></g><g><line stroke="#999" stroke-width="0.5px" class="200" y2="675" x2="308" y1="5" x1="308" id="actor1"/><g id="root-1"><rect class="actor actor-top" ry="3" rx="3" name="OS" height="65" width="150" stroke="#666" fill="#eaeaea" y="0" x="233"/><text style="text-anchor: middle; font-size: 16px; font-weight: 400;" class="actor" alignment-baseline="central" dominant-baseline="central" y="32.5" x="308"><tspan dy="0" x="308">OS Scheduler</tspan></text></g></g><g><line stroke="#999" stroke-width="0.5px" class="200" y2="675" x2="75" y1="5" x1="75" id="actor0"/><g id="root-0"><rect class="actor actor-top" ry="3" rx="3" name="T1" height="65" width="150" stroke="#666" fill="#eaeaea" y="0" x="0"/><text style="text-anchor: middle; font-size: 16px; font-weight: 400;" class="actor" alignment-baseline="central" dominant-baseline="central" y="32.5" x="75"><tspan dy="0" x="75">Thread A</tspan></text></g></g><style>#cs{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:14px;fill:#222222;}#cs .edge-thickness-normal{stroke-width:2px;}#cs .edge-thickness-thick{stroke-width:3.5px;}#cs .edge-pattern-solid{stroke-dasharray:0;}#cs .edge-pattern-dashed{stroke-dasharray:3;}#cs .edge-pattern-dotted{stroke-dasharray:2;}#cs .marker{fill:#555555;stroke:#555555;}#cs .marker.cross{stroke:#555555;}#cs svg{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:14px;}#cs .actor{stroke:#222222;fill:#FFFFFF;}#cs text.actor>tspan{fill:#222222;stroke:none;}#cs .actor-line{stroke:#888888;}#cs .messageLine0{stroke-width:1.5;stroke-dasharray:none;stroke:#555555;}#cs .messageLine1{stroke-width:1.5;stroke-dasharray:2,2;stroke:#555555;}#cs #arrowhead path{fill:#555555;stroke:#555555;}#cs .sequenceNumber{fill:#aaaaaa;}#cs #sequencenumber{fill:#555555;}#cs #crosshead path{fill:#555555;stroke:#555555;}#cs .messageText{fill:#222222;stroke:none;}#cs .labelBox{stroke:#222222;fill:#FFFFFF;}#cs .labelText,#cs .labelText>tspan{fill:#222222;stroke:none;}#cs .loopText,#cs .loopText>tspan{fill:#222222;stroke:none;}#cs .loopLine{stroke-width:2px;stroke-dasharray:2,2;stroke:#222222;fill:#222222;}#cs .note{stroke:#555555;fill:#FFFFFF;}#cs .noteText,#cs .noteText>tspan{fill:#555555;stroke:none;}#cs .activation0{fill:#FFFFFF;stroke:#222222;}#cs .activation1{fill:#FFFFFF;stroke:#222222;}#cs .activation2{fill:#FFFFFF;stroke:#222222;}#cs .actor-man line{stroke:#222222;fill:#FFFFFF;}#cs .actor-man circle,#cs line{stroke:#222222;fill:#FFFFFF;stroke-width:2px;}</style><defs><marker orient="auto" markerHeight="12" markerWidth="12" markerUnits="userSpaceOnUse" refY="5" refX="7.9" id="arrowhead"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><g><rect class="note" ry="3" rx="3" height="41" width="167" stroke="#666" fill="#EDF2AE" y="151" x="-8.5"/><text style="font-size: 16px; font-weight: 400;" dy="1em" class="noteText" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" y="156" x="75"><tspan x="75">Preempted or blocks</tspan></text></g><g><rect class="note" ry="3" rx="3" height="41" width="167" stroke="#666" fill="#EDF2AE" y="446" x="424.5"/><text style="font-size: 16px; font-weight: 400;" dy="1em" class="noteText" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" y="451" x="508"><tspan x="508">Preempted or blocks</tspan></text></g><text style="font-size: 16px; font-weight: 400;" dy="1em" class="messageText" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" y="80" x="76">Execute instructions</text><path style="fill: none;" marker-end="url(#arrowhead)" stroke="none" stroke-width="2" class="messageLine0" d="M 76,111 C 136,101 136,141 76,131"/><text style="font-size: 16px; font-weight: 400;" dy="1em" class="messageText" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" y="207" x="190">Yield execution</text><line style="fill: none;" marker-end="url(#arrowhead)" stroke="none" stroke-width="2" class="messageLine0" y2="238" x2="304" y1="238" x1="76"/><text style="font-size: 16px; font-weight: 400;" dy="1em" class="messageText" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" y="253" x="309">Preserve execution state</text><path style="fill: none;" marker-end="url(#arrowhead)" stroke="none" stroke-width="2" class="messageLine0" d="M 309,284 C 369,274 369,314 309,304"/><text style="font-size: 16px; font-weight: 400;" dy="1em" class="messageText" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" y="329" x="407">Dispatch</text><line style="fill: none;" marker-end="url(#arrowhead)" stroke="none" stroke-width="2" class="messageLine0" y2="360" x2="504" y1="360" x1="309"/><text style="font-size: 16px; font-weight: 400;" dy="1em" class="messageText" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" y="375" x="509">Execute instructions</text><path style="fill: none;" marker-end="url(#arrowhead)" stroke="none" stroke-width="2" class="messageLine0" d="M 509,406 C 569,396 569,436 509,426"/><text style="font-size: 16px; font-weight: 400;" dy="1em" class="messageText" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" y="502" x="410">Yield execution</text><line style="fill: none;" marker-end="url(#arrowhead)" stroke="none" stroke-width="2" class="messageLine0" y2="533" x2="312" y1="533" x1="507"/><text style="font-size: 16px; font-weight: 400;" dy="1em" class="messageText" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" y="548" x="193">Resume saved context</text><line style="fill: none;" marker-end="url(#arrowhead)" stroke="none" stroke-width="2" class="messageLine0" y2="579" x2="79" y1="579" x1="307"/><text style="font-size: 16px; font-weight: 400;" dy="1em" class="messageText" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" y="594" x="76">Continue execution</text><path style="fill: none;" marker-end="url(#arrowhead)" stroke="none" stroke-width="2" class="messageLine0" d="M 76,625 C 136,615 136,655 76,645"/></svg>
