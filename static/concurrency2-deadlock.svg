    <path d="M210 198 L508 68" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dl-a)"/>
    <text x="300" y="180" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#555555">waits for</text>
</svg>
