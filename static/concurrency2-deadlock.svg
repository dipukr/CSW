    <rect x="40" y="30" width="170" height="48" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="125" y="58.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#222222">Thread A</text>
    <rect x="40" y="190" width="170" height="48" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="125" y="218.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#222222">Thread B</text>
    <rect x="510" y="30" width="170" height="48" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
