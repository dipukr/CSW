    <rect x="510" y="190" width="170" height="48" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="595" y="218.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#222222">Lock 2</text>
    <path d="M210 54 H508" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#dl-a)"/>
    <text x="360" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">holds</text>
    <path d="M210 214 H508" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#dl-a)"/>
    <text x="360" y="230" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">holds</text>
