<svg width="720" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Three readers hold the shared read lock at the same time, while a writer waits for the exclusive write lock">
    <defs><marker id="rw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs>
    <rect x="40" y="20" width="170" height="48" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="125" y="48.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#222222">Reader 1</text>
    <rect x="40" y="84" width="170" height="48" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="125" y="112.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#222222">Reader 2</text>
    <rect x="40" y="148" width="170" height="48" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="125" y="176.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#222222">Reader 3</text>
    <rect x="40" y="232" width="170" height="48" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="125" y="260.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#222222">Writer</text>
    <rect x="490" y="84" width="190" height="48" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="585" y="112.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#222222">Read Lock (shared)</text>
    <rect x="490" y="232" width="190" height="48" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="585" y="260.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#222222">Write Lock (exclusive)</text>
    <path d="M210 44 L488 100" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#rw-a)"/>
    <path d="M210 108 H488" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#rw-a)"/>
    <path d="M210 172 L488 116" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#rw-a)"/>
    <text x="350" y="100" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#222222">hold</text>
    <path d="M210 256 H488" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#rw-a)"/>
    <text x="350" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#555555">waits until all readers leave</text>
</svg>
