<svg width="880" height="280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" role="img" aria-label="Overlapping register windows: each procedure's window has parameter, local and temporary registers. The temporary registers of procedure A are the same physical registers as the parameter registers of procedure B, which it calls, so parameters pass with no memory traffic. Global registers are shared by all procedures">
    <defs><marker id="rw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="rw-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="rw-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <text x="20" y="77" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Procedure A</text>
    <path d="M143 50 H280 A0 0 0 0 1 280 50 V94 A0 0 0 0 1 280 94 H143 A3 3 0 0 1 140 91 V53 A3 3 0 0 1 143 50 Z" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="210.0" y="70" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Parameter</text>
    <text x="210.0" y="85" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">registers</text>
    <path d="M280 50 H420 A0 0 0 0 1 420 50 V94 A0 0 0 0 1 420 94 H280 A0 0 0 0 1 280 94 V50 A0 0 0 0 1 280 50 Z" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="350.0" y="70" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Local</text>
    <text x="350.0" y="85" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">registers</text>
    <path d="M420 50 H557 A3 3 0 0 1 560 53 V91 A3 3 0 0 1 557 94 H420 A0 0 0 0 1 420 94 V50 A0 0 0 0 1 420 50 Z" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="490.0" y="70" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Temporary</text>
    <text x="490.0" y="85" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">registers</text>
    <text x="20" y="167" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Procedure B</text>
    <path d="M423 140 H560 A0 0 0 0 1 560 140 V184 A0 0 0 0 1 560 184 H423 A3 3 0 0 1 420 181 V143 A3 3 0 0 1 423 140 Z" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="490.0" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Parameter</text>
    <text x="490.0" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">registers</text>
    <path d="M560 140 H700 A0 0 0 0 1 700 140 V184 A0 0 0 0 1 700 184 H560 A0 0 0 0 1 560 184 V140 A0 0 0 0 1 560 140 Z" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="630.0" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Local</text>
    <text x="630.0" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">registers</text>
    <path d="M700 140 H837 A3 3 0 0 1 840 143 V181 A3 3 0 0 1 837 184 H700 A0 0 0 0 1 700 184 V140 A0 0 0 0 1 700 140 Z" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <text x="770.0" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Temporary</text>
    <text x="770.0" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">registers</text>
    <text x="20" y="185" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">(called by A)</text>
    <rect x="416" y="38" width="148" height="168" rx="3" fill="none" stroke="#B45309" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="490.0" y="222" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#B45309">same physical registers</text>
    <text x="490.0" y="238" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#B45309">(A's temporaries = B's parameters)</text>
    <rect x="140" y="244" width="140" height="30" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#rw-s)"/>
    <text x="210.0" y="263.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1E293B">Global registers</text>
    <text x="290" y="263" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">shared by every procedure</text>
</svg>
