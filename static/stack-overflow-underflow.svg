<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 201" width="648" height="402" role="img" aria-label="Stack overflow: pushing 50 into a full stack holding 10 to 40; stack underflow: popping an empty stack where top = -1"><path d="M35 51 V169 A3 3 0 0 0 38 172 H124 A3 3 0 0 0 127 169 V51" stroke="#555555" stroke-width="1.7" fill="none"></path><rect x="46" y="142" width="70" height="23" rx="3" fill="#FFFFFF" stroke="#222222"></rect><text x="81" y="157" text-anchor="middle" font-size="12" font-weight="600" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">10</text><rect x="46" y="113" width="70" height="23" rx="3" fill="#FFFFFF" stroke="#222222"></rect><text x="81" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">20</text><rect x="46" y="84" width="70" height="23" rx="3" fill="#FFFFFF" stroke="#222222"></rect><text x="81" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">30</text><rect x="46" y="55" width="70" height="23" rx="3" fill="#EDEDED" stroke="#222222"></rect><text x="81" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">40</text><rect x="46" y="6" width="70" height="23" rx="3" fill="#FFFFFF" stroke="#555555" stroke-dasharray="4 3"></rect><text x="81" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#555555" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">50</text><path d="M 81 31 V 47" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3" fill="none"></path><path d="M 76 42 L 81 48 L 86 42" stroke="#555555" stroke-width="1.5" fill="none"></path><text x="67" y="44" text-anchor="end" font-size="11" fill="#555555" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">push(50)<