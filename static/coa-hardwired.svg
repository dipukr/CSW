<svg width="780" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-label="Hardwired control unit: the opcode in the instruction register is decoded into one line per instruction (I0 to Ik). A timing generator driven by the clock produces timing signals T1 to Tn. Combinational logic in the control unit combines decoded instruction, timing signals and flags into control signals C0 to Cm">
