<svg width="640" height="150" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" role="img" aria-label="Queue: elements 10, 20, 30, 40 in a row; dequeue or poll removes 10 from the front on the left, enqueue or offer adds 50 at the rear on the right, first in first out">
    <defs><marker id="qu-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker><marker id="qu-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker></defs>
    <rect x="180" y="56" width="70" height="40" rx="0" fill="#FFF7ED" stroke="#B45309" stroke-width="1.2"/>
    <text x="215.0" y="81.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#222222">10</text>
    <rect x="250" y="56" width="70" height="40" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="285.0" y="81.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#222222">20</text>
    <rect x="320" y="56" width="70" height="40" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="355.0" y="81.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#222222">30</text>
    <rect x="390" y="56" width="70" height="40" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="425.0" y="81.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#222222">40</text>
    <text x="215" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#B45309">front</text>
    <text x="425" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#666666">rear</text>
    <path d="M176 76 H80" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#qu-a)"/>
    <text x="20" y="120" text-anchor="start" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="600" fill="#222222">dequeue / poll() → 10</text>
    <path d="M580 76 H464" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#qu-a)"/>
    <text x="620" y="120" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="600" fill="#222222">enqueue / offer(50)</text>
    <text x="320" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#666666" font-style="italic">First In, First Out</text>
</svg>
