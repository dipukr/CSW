<svg width="640" height="150" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" role="img" aria-label="Queue: elements 10, 20, 30, 40 in a row; dequeue or poll removes 10 from the front on the left, enqueue or offer adds 50 at the rear on the right, first in first out">
    <defs><marker id="qu-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="qu-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="qu-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <path d="M183 56 H250 A0 0 0 0 1 250 56 V96 A0 0 0 0 1 250 96 H183 A3 3 0 0 1 180 93 V59 A3 3 0 0 1 183 56 Z" fill="#FFF7ED" stroke="#B45309" stroke-width="1.2"/>
    <text x="215.0" y="81.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#1E293B">10</text>
    <path d="M250 56 H320 A0 0 0 0 1 320 56 V96 A0 0 0 0 1 320 96 H250 A0 0 0 0 1 250 96 V56 A0 0 0 0 1 250 56 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="285.0" y="81.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#1E293B">20</text>
    <path d="M320 56 H390 A0 0 0 0 1 390 56 V96 A0 0 0 0 1 390 96 H320 A0 0 0 0 1 320 96 V56 A0 0 0 0 1 320 56 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="355.0" y="81.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#1E293B">30</text>
    <path d="M390 56 H457 A3 3 0 0 1 460 59 V93 A3 3 0 0 1 457 96 H390 A0 0 0 0 1 390 96 V56 A0 0 0 0 1 390 56 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="425.0" y="81.6" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" fill="#1E293B">40</text>
    <text x="215" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#B45309">front</text>
    <text x="425" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B">rear</text>
    <path d="M176 76 H80" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#qu-a)"/>
    <text x="20" y="120" text-anchor="start" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="600" fill="#1E293B">dequeue / poll() → 10</text>
    <path d="M580 76 H464" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#qu-a)"/>
    <text x="620" y="120" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="600" fill="#1E293B">enqueue / offer(50)</text>
    <text x="320" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" font-style="italic">First In, First Out</text>
    <rect x="252" y="6" width="133" height="22" rx="3" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="318.5" y="21" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#047857">offer / poll  O(1)</text>
