<svg width="760" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Linking two object files: the .text sections of main.o and util.o are merged into one .text section of the executable at 0x401000 and 0x401020, the .data sections into one .data section at 0x404000 and 0x404008, and the unresolved call in main is patched to call 0x401020">
    <defs><marker id="lr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs>
    <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" fill="#222222">
        <!-- object files -->
        <g fill="#FFFFFF" stroke="#222222" stroke-width="1.2">
            <rect x="20" y="20" width="240" height="130" rx="3"/>
            <rect x="20" y="170" width="240" height="140" rx="3"/>
            <rect x="440" y="20" width="300" height="290" rx="3"/>
        </g>
        <g font-size="14" font-weight="600">
            <text x="34" y="42">main.o</text>
            <text x="34" y="192">util.o</text>
            <text x="454" y="42">prog (executable)</text>
        </g>
        <g fill="#F8FAFC" stroke="#94A3B8" stroke-width="1">
            <rect x="34" y="54" width="212" height="50" rx="2"/>
            <rect x="34" y="110" width="212" height="30" rx="2"/>
            <rect x="34" y="204" width="212" height="50" rx="2"/>
            <rect x="34" y="262" width="212" height="38" rx="2"/>
            <rect x="456" y="74" width="268" height="40" rx="2"/>
            <rect x="456" y="118" width="268" height="40" rx="2"/>
            <rect x="456" y="194" width="268" height="40" rx="2"/>
            <rect x="456" y="238" width="268" height="40" rx="2"/>
        </g>
        <g font-size="11" fill="#666666" text-anchor="end">
            <text x="240" y="68">.text</text>
            <text x="240" y="124">.data</text>
            <text x="240" y="218">.text</text>
            <text x="240" y="276">.data</text>
        </g>
        <g font-size="12" font-weight="600" fill="#666666">
            <text x="456" y="66">.text (merged)</text>
            <text x="456" y="186">.data (merged)</text>
        </g>
        <g font-size="12" font-family="ui-monospace, Consolas, monospace">
            <text x="44" y="74">main:</text>
            <text x="44" y="94">call ????</text>
            <text x="44" y="130">count</text>
            <text x="44" y="234">sum:</text>
            <text x="44" y="286">total</text>

            <text x="466" y="90">0x401000  main:</text>
            <text x="466" y="107" fill="#B45309" font-weight="700">call 0x401020</text>
            <text x="466" y="142">0x401020  sum:</text>
            <text x="466" y="218">0x404000  count</text>
            <text x="466" y="262">0x404008  total</text>
        </g>
        <text x="122" y="94" font-size="11" fill="#B45309">&#8592; relocation: sum</text>

        <g fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#lr-a)">
            <path d="M246 79 L454 94"/>
            <path d="M246 229 L454 138"/>
            <path d="M246 125 L454 214"/>
            <path d="M246 281 L454 258"/>
        </g>
    </g>
</svg>
