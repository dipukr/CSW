<svg width="760" height="370" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-label="Stack frame growth for nested calls. (a) While P is active the stack holds P's frame: return point, old frame pointer, parameters and local variables, with the frame pointer at the base of P's frame and the stack pointer at its top. (b) After P calls Q, Q's frame is pushed on top, and the frame and stack pointers move to Q's frame">
