<svg width="720" height="122" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 122" role="img" aria-label="Three levels of database design: conceptual design leads to logical design, which leads to physical design">
    <defs><marker id="ddl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs>
    <path d="M222 61 H258" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ddl-a)"/>
    <path d="M462 61 H498" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ddl-a)"/>
    <rect x="20" y="14" width="200" height="94" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="120" y="40" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Conceptual Design</text>
    <text text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555"><tspan x="120" y="61">What data exists</tspan><tspan x="120" y="75">and how business</tspan><tspan x="120" y="89">entities relate</tspan></text>
    <rect x="260" y="14" width="200" height="94" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="360" y="40" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Logical Design</text>
    <text text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555"><tspan x="360" y="61">How entities become tables,</tspan><tspan x="360" y="75">keys, relationships,</tspan><tspan x="360" y="89">and constraints</tspan></text>
    <rect x="500" y="14" width="200" height="94" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="600" y="40" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Physical Design</text>
    <text text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#555555"><tspan x="600" y="61">How data is indexed,</tspan><tspan x="600" y="75">partitioned, and</tspan><tspan x="600" y="89">physically accessed</tspan></text>
</svg>
