<svg width="760" height="250" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Lazy binding: the program calls puts@plt; the PLT stub jumps through the GOT slot for puts. On the first call the slot points to the dynamic linker's resolver, which finds puts in libc.so, writes its address into the GOT and jumps to it. Later calls go from the GOT straight to puts">
    <defs>
        <marker id="pg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker>
        <marker id="pg-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker>
    </defs>
    <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" fill="#222222">
        <g stroke="#222222" stroke-width="1.2">
            <rect x="20" y="40" width="170" height="56" rx="3" fill="#FFFFFF"/>
            <rect x="250" y="40" width="170" height="56" rx="3" fill="#FFFFFF"/>
            <rect x="480" y="40" width="110" height="56" rx="3" fill="#FFFFFF"/>
            <rect x="630" y="40" width="110" height="56" rx="3" fill="#FFFFFF"/>
            <rect x="380" y="170" width="200" height="56" rx="10" fill="#F1F5F9"/>
        </g>
        <g font-size="11" fill="#666666" text-anchor="middle">
            <text x="105" y="30">your code (.text)</text>
            <text x="335" y="30">PLT stub</text>
            <text x="535" y="30">GOT slot</text>
            <text x="685" y="30">libc.so</text>
        </g>
        <g font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">
            <text x="105" y="73">call puts@plt</text>
            <text x="335" y="73">jmp *GOT[puts]</text>
            <text x="535" y="73">GOT[puts]</text>
            <text x="685" y="73">puts:</text>
        </g>
        <text x="480" y="194" font-size="14" font-weight="600" text-anchor="middle">Dynamic linker</text>
        <text x="480" y="212" font-size="11" text-anchor="middle" fill="#666666">resolver in ld.so</text>

        <g fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#pg-a)">
            <path d="M190 68 H248"/>
            <path d="M420 68 H478"/>
            <path d="M590 68 H628"/>
        </g>
        <g fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#pg-b)">
            <path d="M515 96 L470 168" stroke-dasharray="5 4"/>
            <path d="M560 170 L560 98"/>
            <path d="M580 186 L668 98"/>
        </g>
        <g font-size="11" fill="#B45309">
            <text x="420" y="136" text-anchor="end">&#9312; first call: slot</text>
            <text x="420" y="150" text-anchor="end">points to resolver</text>
            <text x="568" y="122">&#9313; writes</text>
            <text x="582" y="136">address</text>
            <text x="646" y="156">&#9314; jumps to puts</text>
        </g>
        <text x="609" y="58" font-size="11" fill="#555555" text-anchor="middle">later</text>
    </g>
</svg>
