<svg width="820" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Block diagram of an I/O module: on the system-bus side, data lines connect to data registers and status/control registers, and address and control lines go to I/O logic. On the device side, one external device interface logic block per device exchanges data, status and control signals with that device">
