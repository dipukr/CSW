<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 178" width="720" height="178" role="img" aria-label="Reversal loop invariant. After processing 10 and 20, the two chains are separate. The saved suffix prevents data loss."><defs><marker id="rev" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#555555"/></marker></defs><text fill="#222222" font-size="12" font-weight="600" x="180" y="20" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Reversed prefix</text><text fill="#222222" font-size="12" font-weight="600" x="520" y="20" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Unprocessed suffix</text><g stroke="#64748b" fill="none" stroke-width="2" marker-end="url(#rev)"><path d="M245 89H154"/><path d="M100 89H45"/><path d="M490 89H575"/></g><rect fill="#EDEDED" x="100" y="67" width="65" height="44" rx="3" stroke="#222222"/><text fill="#222222" font-size="20" font-weight="600" x="132" y="95" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">10</text><rect fill="#EDEDED" x="245" y="67" width="65" height="44" rx="3" stroke="#222222"/><text fill="#222222" font-size="20" font-weight="600" x="277" y="95" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">20</text><rect fill="#EDEDED" x="425" y="67" width="65" height="44" rx="3" stroke="#222222"/><text fill="#222222" font-size="20" font-weight="600" x="457" y="95" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">30</text><rect fill="#EDEDED" x="575" y="67" width="65" height="44" rx="3" stroke="#222222"/><text fill="#222222" font-size="20" font-weight="600" x="607" y="95" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">40</text><text fill="#222222" font-size="10" font-weight="600" x="25" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">null</text><text fill="#222222" font-size="12" font-weight="600" x="277" y="137" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">prev</text><text fill="#222222" font-size="12" font-weight="600" x="457" y="137" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">cur</text><text fill="#222222" font-size="12" font-weight="600" x="607" y="137" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">next (saved)</text><path d="M277 122V113 M457 122V113 M607 122V113" stroke="#555555"/><text fill="#555555" font-size="12" font-weight="400" x="360" y="168" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Next rewrite: cur.next = prev</text></svg>
