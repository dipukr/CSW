    <text x="20" y="44" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Core 1</text>
    <rect x="100" y="20" width="580" height="36" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="390" y="42.55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Task A</text>
    <text x="20" y="94" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Core 2</text>
    <rect x="100" y="70" width="580" height="36" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="390" y="92.55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Task B</text>
    <text x="20" y="144" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Core 3</text>
    <rect x="100" y="120" width="580" height="36" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="390" y="142.55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Task C</text>
    <path d="M100 176 H684" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cp-a)"/>
    <text x="684" y="196" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#555555" font-style="italic">time</text>
