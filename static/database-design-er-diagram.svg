<svg width="720" height="310" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-label="ER diagram: a customer places zero or more customer orders; a customer order contains one or more order items; a product is referenced by zero or more order items; ORDER_ITEM is the junction table with a composite key of order_id and product_id">
