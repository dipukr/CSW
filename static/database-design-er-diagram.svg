        <text x="74" y="82" font-size="11.5" fill="#555555">string</text><text x="142" y="82" font-size="11.5" fill="#222222">email</text><text x="286" y="82" text-anchor="end" font-size="10.5" font-weight="600" fill="#555555">UK</text>

        <rect x="420" y="14" width="240" height="104" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
