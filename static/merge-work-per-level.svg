<svg width="640" height="230" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Merging work per level for n = 8: level 1 merges 4 runs of 2, level 2 merges 2 runs of 4, level 3 merges 1 run of 8; every level processes all 8 elements">
    <defs><marker id="wl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="wl-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="wl-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <text x="40" y="22" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#155E63">MERGING WORK PER LEVEL (n = 8)</text>
    <text x="40" y="52" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748B">Level 1</text>
    <text x="600" y="52" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">4 × 2 = 8 elements</text>
    <rect x="40.0" y="60" width="137.0" height="30" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#wl-s)"/>
    <text x="108.5" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E293B">2</text>
    <rect x="181.0" y="60" width="137.0" height="30" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#wl-s)"/>
    <text x="249.5" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E293B">2</text>
    <rect x="322.0" y="60" width="137.0" height="30" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#wl-s)"/>
    <text x="390.5" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E293B">2</text>
    <rect x="463.0" y="60" width="137.0" height="30" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#wl-s)"/>
    <text x="531.5" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E293B">2</text>
    <text x="40" y="114" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748B">Level 2</text>
    <text x="600" y="114" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">2 × 4 = 8 elements</text>
    <rect x="40.0" y="122" width="278.0" height="30" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#wl-s)"/>
    <text x="179.0" y="142" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E293B">4</text>
    <rect x="322.0" y="122" width="278.0" height="30" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#wl-s)"/>
    <text x="461.0" y="142" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E293B">4</text>
    <text x="40" y="176" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748B">Level 3</text>
    <text x="600" y="176" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">1 × 8 = 8 elements</text>
