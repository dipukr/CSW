<svg width="840" height="310" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" role="img" aria-label="Data flow in the fetch cycle: (1) the PC is copied to MAR; (2) MAR is placed on the address bus; (3) the control unit issues a memory read on the control bus; (4) memory places the instruction on the data bus and it is copied into MBR; (5) MBR is moved to IR; (6) the control unit increments the PC">
