<svg width="880" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-label="Queuing diagram for processor scheduling: admitted jobs wait in the long-term queue, then the short-term queue, then run on the processor until release. A timeout returns the process to the short-term queue. An I/O request places it in the queue for that device; when the I/O completes it returns to the short-term queue">
