<svg width="780" height="262" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 262" role="img" aria-label="Two-stack transfer. Before: inStack holds 10, 20, 30 from bottom to top and outStack is empty. After: inStack is empty and outStack holds 30, 20, 10 from bottom to top, so 10 is on top. Dequeuing then returns 10, 20, 30">
