        <path d="M675 84 H697" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ts-a)"/>
        <rect x="701" y="62" width="50" height="44" rx="3" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
