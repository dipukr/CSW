        <text x="670" y="145" font-size="13" font-weight="400" text-anchor="end" fill="#6B7280">dequeue()</text>
        <path d="M675 140 H697" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ts-a)"/>
