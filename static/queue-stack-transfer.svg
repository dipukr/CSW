    <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" fill="#222222">
        <text x="150" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#222222">Before transfer</text>
        <path d="M43 64 H121 A3 3 0 0 1 124 67 V108 A0 0 0 0 1 124 108 H40 A0 0 0 0 1 40 108 V67 A3 3 0 0 1 43 64 Z" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
        <text x="82.0" y="91.95" font-size="17" font-weight="600" text-anchor="middle" fill="#222222">30</text>
        <path d="M40 108 H124 A0 0 0 0 1 124 108 V152 A0 0 0 0 1 124 152 H40 A0 0 0 0 1 40 152 V108 A0 0 0 0 1 40 108 Z" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
