        <text x="670" y="201" font-size="13" font-weight="400" text-anchor="end" fill="#6B7280">dequeue()</text>
        <path d="M675 196 H697" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ts-a)"/>
        <rect x="701" y="174" width="50" height="44" rx="3" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
        <text x="726" y="202" font-size="17" font-weight="600" text-anchor="middle" fill="#222222">30</text>
