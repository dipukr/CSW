        <text x="132" y="90" font-size="12" font-weight="400" text-anchor="start" fill="#6B7280">top</text>
        <text x="82.0" y="218" font-size="13" font-weight="600" text-anchor="middle" fill="#222222">inStack</text>
        <text x="82.0" y="236" font-size="11" font-weight="400" text-anchor="middle" fill="#6B7280">bottom ↑</text>
        <rect x="170" y="152" width="84" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2" stroke-dasharray="5 4"/>
        <text x="212.0" y="179.0" font-size="13" font-weight="400" text-anchor="middle" fill="#6B7280" font-style="italic">empty</text>
        <text x="212.0" y="218" font-size="13" font-weight="600" text-anchor="middle" fill="#222222">outStack</text>
        <text x="212.0" y="236" font-size="11" font-weight="400" text-anchor="middle" fill="#6B7280">bottom ↑</text>
        <path d="M298 40 V244" fill="none" stroke="#555555" stroke-width="1.5"/>
        <text x="450" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#222222">After transfer</text>
        <rect x="340" y="152" width="84" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2" stroke-dasharray="5 4"/>
        <text x="382.0" y="179.0" font-size="13" font-weight="400" text-anchor="middle" fill="#6B7280" font-style="italic">empty</text>
        <text x="382.0" y="218" font-size="13" font-weight="600" text-anchor="middle" fill="#222222">inStack</text>
        <text x="382.0" y="236" font-size="11" font-weight="400" text-anchor="middle" fill="#6B7280">bottom ↑</text>
        <path d="M473 64 H551 A3 3 0 0 1 554 67 V108 A0 0 0 0 1 554 108 H470 A0 0 0 0 1 470 108 V67 A3 3 0 0 1 473 64 Z" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
