        <text x="512.0" y="135.95" font-size="17" font-weight="600" text-anchor="middle" fill="#222222">20</text>
        <path d="M470 152 H554 A0 0 0 0 1 554 152 V193 A3 3 0 0 1 551 196 H473 A3 3 0 0 1 470 193 V152 A0 0 0 0 1 470 152 Z" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
        <text x="512.0" y="179.95" font-size="17" font-weight="600" text-anchor="middle" fill="#222222">30</text>
