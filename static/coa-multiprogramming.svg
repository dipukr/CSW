<svg width="730" height="410" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 410" role="img" aria-label="Uniprogramming versus multiprogramming. (a) With one program, the processor runs program A, then sits idle while A waits for I/O. (b) With two programs, B runs while A waits, so idle time shrinks. (c) With three programs, A, B and C take turns and the processor is busy the whole time">
