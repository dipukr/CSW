<svg width="360" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-label="Java interface hierarchy: Iterable, then Collection extends Iterable, Queue extends Collection, and Deque extends Queue">
    <defs><marker id="hi-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs>
    <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" fill="#222222">
        <rect x="110" y="16" width="140" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="180" y="44" font-size="16" font-weight="600" text-anchor="middle" fill="#222222">Iterable</text>
        <rect x="110" y="88" width="140" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="180" y="116" font-size="16" font-weight="600" text-anchor="middle" fill="#222222">Collection</text>
        <path d="M180 88 V62" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#hi-a)"/>
        <rect x="110" y="160" width="140" height="44" rx="3" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
        <text x="180" y="188" font-size="16" font-weight="600" text-anchor="middle" fill="#222222">Queue</text>
        <path d="M180 160 V134" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#hi-a)"/>
        <rect x="110" y="232" width="140" height="44" rx="3" fill="#F3F4F6" stroke="#222222" stroke-width="1.2"/>
        <text x="180" y="260" font-size="16" font-weight="600" text-anchor="middle" fill="#222222">Deque</text>
        <path d="M180 232 V206" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#hi-a)"/>
        <text x="192" y="79" font-size="11" font-weight="400" text-anchor="start" fill="#6B7280">extends</text>
    </g>
</svg>
