<svg width="720" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="TCP sits between applications and IP: application layer, transport layer (TCP), internet layer (IP), link and physical layers">
    <defs><marker id="tns-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs>
    <g font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
        <rect x="170" y="14" width="380" height="54" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="360" y="37" font-size="14" font-weight="600" fill="#222222">Application Layer</text>
        <text x="360" y="56" font-size="12" fill="#555555">HTTP/1.1, HTTP/2, SSH, SMTP</text>
        <path d="M360 68 V86" stroke="#555555" stroke-width="1.5" marker-end="url(#tns-a)"/>
        <rect x="170" y="88" width="380" height="54" rx="3" fill="#F3F4F6" stroke="#222222" stroke-width="1.8"/>
        <text x="360" y="111" font-size="14" font-weight="600" fill="#222222">Transport Layer</text>
        <text x="360" y="130" font-size="12" fill="#555555">TCP — ports, streams, reliability</text>
        <path d="M360 142 V160" stroke="#555555" stroke-width="1.5" marker-end="url(#tns-a)"/>
        <rect x="170" y="162" width="380" height="54" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="360" y="185" font-size="14" font-weight="600" fill="#222222">Internet Layer</text>
        <text x="360" y="204" font-size="12" fill="#555555">IP — addressing and routing</text>
        <path d="M360 216 V234" stroke="#555555" stroke-width="1.5" marker-end="url(#tns-a)"/>
        <rect x="170" y="236" width="380" height="54" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
        <text x="360" y="259" font-size="14" font-weight="600" fill="#222222">Link / Physical Layers</text>
        <text x="360" y="278" font-size="12" fill="#555555">Ethernet, Wi-Fi, physical signals</text>
        <text x="360" y="312" font-size="12" fill="#555555">TCP sits between applications and IP</text>
    </g>
</svg>
