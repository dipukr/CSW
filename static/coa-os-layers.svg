<svg width="860" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Computer hardware and software structure: application programs sit on libraries and utilities, which sit on the operating system, which runs on the execution hardware (with memory translation, I/O devices and networking, main memory and the system interconnect). The API is the boundary below the application programs, the ABI is the boundary at the operating system, and the ISA is the boundary between software and hardware">
    <defs><marker id="osl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="osl-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="osl-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <rect x="40" y="20" width="480" height="44" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#osl-s)"/>
    <text x="280.0" y="46.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Application programs</text>
    <rect x="40" y="76" width="480" height="44" rx="3" fill="#E7F6F4" stroke="#5EBFB5" stroke-width="1.2" filter="url(#osl-s)"/>
    <text x="280.0" y="102.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Libraries / utilities</text>
    <rect x="40" y="132" width="480" height="44" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#osl-s)"/>
    <text x="280.0" y="158.6" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Operating system</text>
    <rect x="40" y="194" width="480" height="40" rx="3" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2" filter="url(#osl-s)"/>
    <text x="280.0" y="218.6" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Execution hardware</text>
    <rect x="40" y="244" width="114" height="50" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#osl-s)"/>
    <text x="97.0" y="265.8" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1E293B">Memory</text>
    <text x="97.0" y="280.3" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1E293B">translation</text>
    <rect x="162" y="244" width="114" height="50" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#osl-s)"/>
    <text x="219.0" y="265.8" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1E293B">I/O devices and</text>
    <text x="219.0" y="280.3" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1E293B">networking</text>
    <rect x="284" y="244" width="114" height="50" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#osl-s)"/>
    <text x="341.0" y="265.8" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1E293B">Main</text>
    <text x="341.0" y="280.3" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1E293B">memory</text>
    <rect x="406" y="244" width="114" height="50" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#osl-s)"/>
    <text x="463.0" y="265.8" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1E293B">System</text>
    <text x="463.0" y="280.3" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1E293B">interconnect</text>
    <path d="M30 70 H560" fill="none" stroke="#B45309" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="570" y="75" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">API</text>
    <text x="610" y="75" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">application programming interface</text>
    <path d="M30 126 H560" fill="none" stroke="#B45309" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="570" y="131" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">ABI</text>
    <text x="610" y="131" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">application binary interface</text>
    <path d="M30 186 H560" fill="none" stroke="#B45309" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="570" y="191" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">ISA</text>
    <text x="610" y="191" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">instruction set architecture</text>
</svg>
