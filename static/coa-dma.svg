<svg width="780" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-label="Typical DMA block diagram: data lines connect to a data register and address lines to an address register; a data count register tracks the remaining words; control logic exchanges DMA request and acknowledge with the I/O device and interrupt, read and write signals with the system bus">
