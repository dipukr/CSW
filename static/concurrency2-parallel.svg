    <text x="20" y="44" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Core 1</text>
    <rect x="110" y="20" width="576" height="36" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="398" y="42.55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Thread A</text>
    <text x="20" y="94" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Core 2</text>
    <rect x="110" y="70" width="576" height="36" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="398" y="92.55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Thread B</text>
    <text x="20" y="144" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Core 3</text>
    <rect x="110" y="120" width="576" height="36" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="398" y="142.55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#222222">Thread C</text>
    <path d="M110 176 H692" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cp-a)"/>
    <text x="692" y="196" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#555555" font-style="italic">time</text>
