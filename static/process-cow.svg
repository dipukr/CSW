<svg width="720" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Copy-on-write: right after fork, the parent and child page tables share one physical page through read-only mappings; when the child writes, a COW fault gives it a copied page while the parent keeps the original">
    <defs><marker id="cw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#555555"/></marker></defs>
    <rect x="20" y="20" width="680" height="178" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="360" y="44" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#555555">Immediately after fork</text>
    <rect x="40" y="62" width="170" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="125" y="88.375" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#222222">Parent page table</text>
    <rect x="40" y="134" width="170" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="125" y="160.375" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#222222">Child page table</text>
    <rect x="490" y="98" width="190" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="585" y="124.375" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#222222">Shared physical page</text>
    <path d="M210 84 C 350 84, 380 112, 488 116" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cw-a)"/>
    <text x="330" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#555555">Read-only COW mapping</text>
    <path d="M210 156 C 350 156, 380 128, 488 124" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cw-a)"/>
    <text x="330" y="172" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#555555">Read-only COW mapping</text>
    <path d="M360 198 V252" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cw-a)"/>
    <text x="372" y="230" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#222222">Child write triggers COW fault</text>
    <rect x="20" y="254" width="680" height="150" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="360" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#555555">After child writes</text>
    <rect x="40" y="296" width="170" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="125" y="322.375" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#222222">Parent page table</text>
    <path d="M210 318 H488" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cw-a)"/>
    <rect x="490" y="296" width="190" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="585" y="322.375" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#222222">Original physical page</text>
    <rect x="40" y="350" width="170" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="125" y="376.375" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#222222">Child page table</text>
    <path d="M210 372 H488" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#cw-a)"/>
    <rect x="490" y="350" width="190" height="44" rx="3" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="585" y="376.375" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#222222">Copied physical page</text>
</svg>
