<svg width="820" height="350" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-label="Memory hierarchy from top to bottom: registers, L1 cache, L2 and L3 cache, main memory (DRAM), solid-state and magnetic disk, and off-line storage such as tape and optical disc. Going down, capacity grows and cost per bit falls; going up, access time falls and cost per bit rises">
    <defs><marker id="mh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="mh-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="mh-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <rect x="360.0" y="16" width="220" height="46" rx="3" fill="#E7F6F4" stroke="#5EBFB5" stroke-width="1.2" filter="url(#mh-s)"/>
    <text x="470" y="36" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Registers</text>
    <text x="470" y="53" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B">inside the processor, under 1 ns</text>
    <rect x="314.0" y="70" width="312" height="46" rx="3" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" filter="url(#mh-s)"/>
    <text x="470" y="90" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">L1 cache</text>
    <text x="470" y="107" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B">per core, about 1 ns</text>
    <rect x="268.0" y="124" width="404" height="46" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#mh-s)"/>
    <text x="470" y="144" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">L2 / L3 cache</text>
    <text x="470" y="161" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B">SRAM, a few ns</text>
    <rect x="222.0" y="178" width="496" height="46" rx="3" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2" filter="url(#mh-s)"/>
    <text x="470" y="198" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Main memory</text>
    <text x="470" y="215" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B">DRAM, tens of ns</text>
    <rect x="176.0" y="232" width="588" height="46" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#mh-s)"/>
    <text x="470" y="252" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">SSD / magnetic disk</text>
    <text x="470" y="269" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B">outboard storage, µs (SSD) to ms (HDD)</text>
    <rect x="130.0" y="286" width="680" height="46" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#mh-s)"/>
    <text x="470" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Tape / optical disc</text>
    <text x="470" y="323" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B">off-line storage, seconds or more</text>
    <path d="M70 330 V20" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mh-a)"/>
    <text transform="rotate(-90 56 175)" x="56" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">faster, costlier per bit</text>
    <path d="M110 20 V330" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#mh-a)"/>
    <text transform="rotate(90 128 175)" x="128" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">larger, cheaper per bit</text>
</svg>
