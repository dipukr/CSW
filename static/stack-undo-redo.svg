<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 233" width="720" height="466" role="img" aria-label="Undo and redo: the undo stack holds states A, B and C, the current state is D and the redo stack is empty; undo moves the current state to the redo stack and redo moves it back"><rect x="10" y="63" width="94" height="129" rx="3" fill="#FFFFFF" stroke="#222222"></rect><text x="57" y="51" text-anchor="middle" font-size="12" font-weight="600" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Undo stack</text><rect x="17" y="152" width="80" height="31" rx="3" fill="#EDEDED" stroke="#222222" stroke-width="1.2"></rect><text x="57" y="172" fill="#222222" text-anchor="middle" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">State A</text><rect x="17" y="114" width="80" height="31" rx="3" fill="#EDEDED" stroke="#222222" stroke-width="1.2"></rect><text x="57" y="134" fill="#222222" text-anchor="middle" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">State B</text><rect x="17" y="76" width="80" height="31" rx="3" fill="#EDEDED" stroke="#222222" stroke-width="1.2"></rect><text x="57" y="96" fill="#222222" text-anchor="middle" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">State C</text><rect x="128" y="100" width="104" height="61" rx="3" fill="#FFFFFF" stroke="#222222"></rect><text x="180" y="122" text-anchor="middle" font-size="10" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Current state</text><text x="180" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">State D</text><rect x="256" y="63" width="94" height="129" rx="3" fill="#FFFFFF" stroke="#222222"></rect><text x="303" y="51" text-anchor="middle" font-size="12" font-weight="600" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Redo stack</text><text x="303" y="134" text-anchor="middle" font-size="12" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Empty</text><path d="M104 94 H128 l-5 -4 M128 94 l-5 4 M232 94 H256 l-5 -4 M256 94 l-5 4" stroke="#555555" stroke-width="1.5" fill="none"></path><path d="M256 173 H232 l5 -4 M232 173 l5 4 M128 173 H104 l5 -4 M104 173 l5 4" stroke="#555555" stroke-width="1.5" stroke-dasharray="3 2" fill="none"></path><text x="180" y="26" font-size="12" font-weight="600" text-anchor="middle" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Undo →</text><text x="180" y="219" font-size="12" font-weight="600" text-anchor="middle" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">← Redo</text></svg>
