<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="720" height="600" role="img" aria-label="Treiber stack CAS loop: read the current top, prepare the new top, compare-and-set; if CAS fails retry, otherwise complete"><rect x="94" y="10" width="172" height="36" rx="3" stroke="#222222" fill="#FFFFFF"></rect><text x="180" y="33" text-anchor="middle" font-size="12" font-weight="500" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Read current TOP</text><rect x="94" y="64" width="172" height="36" rx="3" stroke="#222222" fill="#FFFFFF"></rect><text x="180" y="87" text-anchor="middle" font-size="12" font-weight="500" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Prepare new TOP</text><rect x="94" y="118" width="172" height="36" rx="3" stroke="#222222" fill="#FFFFFF"></rect><text x="180" y="141" text-anchor="middle" font-size="12" font-weight="500" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Compare-And-Set</text><path d="M180 46 V64 M180 100 V118 M180 154 V174" stroke="#555555" stroke-width="1.5"></path><path d="M180 174 L240 210 L180 246 L120 210 Z" stroke="#555555" fill="#FFFFFF"></path><text x="180" y="207" text-anchor="middle" font-size="11" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">CAS</text><text x="180" y="220" text-anchor="middle" font-size="11" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">successful?</text><path d="M240 210 H311 V28 H266 l6 -4 M266 28 l6 4" stroke="#555555" stroke-width="1.5" fill="none"></path><text x="283" y="200" font-size="11" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">No</text><text x="320" y="117" font-size="10" fill="#222222" transform="rotate(90 320 117)" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Retry</text><path d="M180 246 V264" stroke="#555555" stroke-width="1.5"></path><text x="192" y="258" font-size="10" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Yes</text><rect x="120" y="264" width="120" height="29" rx="3" stroke="#222222" fill="#FFFFFF"></rect><text x="180" y="283" font-size="12" font-weight="600" text-anchor="middle" fill="#222222" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Complete</text></svg>
