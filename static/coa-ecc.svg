<svg width="880" height="280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" role="img" aria-label="Error-correcting code function: when an M-bit word is written, a function f computes K check bits that are stored with it. On a read, f is applied again to the M data bits, and the new check bits are compared with the stored ones. The comparison result (the syndrome) drives a corrector that fixes the data, or signals an uncorrectable error">
