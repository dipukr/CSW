<svg width="800" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Five-state process model: a New process is admitted to Ready, dispatched to Running, and released to Exit. A Running process returns to Ready on a timeout, or moves to Blocked while it waits for an event; when the event occurs it goes back to Ready">
    <defs><marker id="ps-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="ps-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="ps-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
    <rect x="30" y="50" width="130" height="50" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#ps-s)"/>
    <text x="95.0" y="79.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">New</text>
    <rect x="220" y="50" width="130" height="50" rx="3" fill="#E7F6F4" stroke="#5EBFB5" stroke-width="1.2" filter="url(#ps-s)"/>
    <text x="285.0" y="79.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Ready</text>
    <rect x="430" y="50" width="130" height="50" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" filter="url(#ps-s)"/>
    <text x="495.0" y="79.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Running</text>
    <rect x="640" y="50" width="130" height="50" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2" filter="url(#ps-s)"/>
    <text x="705.0" y="79.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Exit</text>
    <rect x="325" y="185" width="130" height="50" rx="3" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" filter="url(#ps-s)"/>
    <text x="390.0" y="214.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Blocked</text>
    <path d="M160 75 H216" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ps-a)"/>
    <text x="188" y="67" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">admit</text>
    <path d="M350 63 H426" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ps-a)"/>
    <text x="390" y="55" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">dispatch</text>
    <path d="M430 88 H354" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ps-a)"/>
    <text x="390" y="106" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">timeout</text>
    <path d="M560 75 H636" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ps-a)"/>
    <text x="598" y="67" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">release</text>
    <path d="M495 100 V210 H459" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ps-a)"/>
    <text x="505" y="160" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">event wait</text>
    <path d="M325 210 H285 V104" fill="none" stroke="#7C8DA6" stroke-width="1.5" marker-end="url(#ps-a)"/>
    <text x="275" y="160" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">event occurs</text>
</svg>
