<svg width="1000" height="452" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" role="img" aria-label="Simplified database indexing: a database query is routed by its access pattern to a suitable index, which finds the matching row IDs, and the database then fetches those rows. equality lookup such as id = 42 uses a Hash Index (hash(key) → bucket, O(1); e.g. PostgreSQL hash, Redis); range / ordered such as price BETWEEN 10 AND 20 uses a B+ Tree (sorted keys, linked leaves, O(log n); e.g. MySQL InnoDB, PostgreSQL); write-heavy such as INSERT, millions / sec uses a LSM Tree (memtable → sorted runs, merged later; e.g. RocksDB, Cassandra); full-text such as MATCH 'linked list' uses a Inverted Index (word → list of documents; e.g. Elasticsearch, Lucene); spatial query such as ST_Within(loc, area) uses a R-Tree / Spatial Index (nested bounding boxes; e.g. PostGIS (GiST)).">
    <defs><marker id="db-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C8DA6"/></marker><marker id="db-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker><filter id="db-s" x="-10%" y="-15%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs>
